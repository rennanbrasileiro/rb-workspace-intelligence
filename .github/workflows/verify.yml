name: Verify Workspace Intelligence
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
      - run: python -m py_compile agent/reader.py agent/folder_index.py
      - run: node scripts/smoke-organizer.mjs
      - run: node scripts/smoke-execution.mjs
      - run: node scripts/smoke-v17-families.mjs
