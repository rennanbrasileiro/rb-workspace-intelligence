<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RB Dev Hub</title><style>body{font:14px Inter,Segoe UI,sans-serif;background:#0b1020;color:#e5e7eb;margin:0;padding:28px}main{max-width:1100px;margin:auto}h1{font-size:30px;margin-bottom:4px}.muted{color:#9ca3af}.tools,.projects{display:grid;gap:12px}.tools{grid-template-columns:repeat(4,1fr);margin:20px 0}.tool,.project{background:#121a2e;border:1px solid #24304d;border-radius:14px;padding:16px}.projects{grid-template-columns:1fr 1fr}.status{display:inline-block;border-radius:999px;padding:5px 8px;background:#24304d}.ok{background:#153d2a;color:#9ce5bb}.bad{background:#48222a;color:#ffb3bd}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:8px;padding:8px 10px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}button.secondary{background:#334155}pre{background:#070b15;border-radius:10px;padding:12px;min-height:50px;white-space:pre-wrap}@media(max-width:750px){.tools,.projects{grid-template-columns:1fr}}</style></head><body><main><div class="muted">RB WORKSPACE INTELLIGENCE</div><h1>RB Dev Hub</h1><p class="muted">Um painel local para clonar, atualizar, abrir no VS Code, validar, buildar e rodar seus projetos sem decorar comandos.</p><div id="tools" class="tools"></div><div id="projects" class="projects"></div><h3>Última ação</h3><pre id="log">Carregando…</pre></main><script>async function load(){const s=await fetch('/api/status').then(r=>r.json());tools.innerHTML=Object.entries(s.tools).map(([k,v])=>`<div class="tool"><b>${k}</b><div class="status ${v?'ok':'bad'}">${v?'instalado':'faltando'}</div></div>`).join('');projects.innerHTML=s.projects.map(p=>`<section class="project"><div class="muted">${p.id}</div><h2>${p.name}</h2><div class="status ${p.cloned?'ok':'bad'}">${p.cloned?'clonado':'não clonado'}</div><p class="muted">${p.path}</p><div class="buttons"><button onclick="act('${p.id}','clone-or-update')">${p.cloned?'Atualizar':'Clonar'}</button><button class="secondary" onclick="act('${p.id}','vscode')">VS Code</button><button class="secondary" onclick="act('${p.id}','install')">Dependências</button><button class="secondary" onclick="act('${p.id}','build')">Build</button><button onclick="act('${p.id}','run')">Rodar</button><button onclick="act('${p.id}','browser')">Abrir app</button><a class="btn" href="${p.repo.replace('.git','')}" target="_blank">GitHub</a></div></section>`).join('');log.textContent=`Projetos: ${s.projectsRoot}`;}async function act(id,a){log.textContent=`${a} · ${id}…`;try{const r=await fetch(`/api/project/${id}/${a}`,{method:'POST'});const j=await r.json();log.textContent=j.message||j.error||JSON.stringify(j);await load()}catch(e){log.textContent=e.message}}load()</script></body></html>
